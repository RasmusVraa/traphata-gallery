<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrapHata — Галерея</title>
    <meta name="description" content="Галерея TrapHata" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="site-header">
      <p class="brand">TrapHata</p>
      <h1 class="headline">Галерея</h1>
      <p class="lede">Загрузите изображение — оно займёт своё место на стене.</p>

      <div class="header-actions">
        <button type="button" id="open-upload" class="btn">Загрузить картинку</button>
        <button type="button" id="open-admin" class="btn btn--ghost">Админ</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p id="admin-badge" class="admin-badge hidden">Режим админа · <button type="button" id="admin-logout" class="linkish">выйти</button></p>
    </header>

    <main>
      <section class="gallery" aria-label="Картины">
        <div id="gallery" class="gallery__wall"></div>
        <p id="empty" class="empty hidden">Пока пусто — загрузите первую картину.</p>
      </section>
    </main>

    <dialog id="upload-dialog" class="panel">
      <form id="upload-form" method="dialog">
        <h2>Новая картина</h2>
        <label class="field">
          <span>Название</span>
          <input id="upload-title" name="title" type="text" maxlength="120" placeholder="Например: Закат у моря" required />
        </label>
        <label class="field">
          <span>Файл</span>
          <input id="upload-file" name="image" type="file" accept="image/*" required />
        </label>
        <div class="panel__actions">
          <button type="button" id="upload-cancel" class="btn btn--ghost" value="cancel">Отмена</button>
          <button type="submit" class="btn" value="default">Загрузить</button>
        </div>
      </form>
    </dialog>

    <dialog id="admin-dialog" class="panel">
      <form id="admin-form" method="dialog">
        <h2>Админ</h2>
        <p class="panel__hint">Введите пароль, чтобы удалять картины.</p>
        <label class="field">
          <span>Пароль</span>
          <input id="admin-password" type="password" autocomplete="current-password" required />
        </label>
        <div class="panel__actions">
          <button type="button" id="admin-cancel" class="btn btn--ghost">Отмена</button>
          <button type="submit" class="btn">Войти</button>
        </div>
      </form>
    </dialog>

    <div id="lightbox" class="lightbox" hidden>
      <button type="button" class="lightbox__close" aria-label="Закрыть">&times;</button>
      <img id="lightbox-img" alt="" />
    </div>

    <script src="/app.js"></script>
  </body>
</html>
