<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Block Blast · Файлы Трэп хаты</title>
    <meta name="description" content="Block Blast из фото и видео со стены." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=blast8" />
    <link rel="stylesheet" href="/themes.css?v=blast8" />
    <link rel="stylesheet" href="/blockblast.css?v=blast8" />
    <script src="/theme.js?v=blast8"></script>
  </head>
  <body class="blast-page">
    <div class="atmosphere" aria-hidden="true">
      <div class="atmosphere__grid"></div>
      <div class="atmosphere__glow"></div>
    </div>

    <main class="blast-shell">
      <header class="blast-top">
        <a class="item-back" href="/">← На стену</a>
        <h1 class="blast-top__title">Block Blast</h1>
        <p class="blast-top__hint">Перетащи фигуру на поле · клик по фигуре, затем по клетке · очищай ряды и столбцы</p>
      </header>

      <section id="game-blast" class="blast-view" aria-label="Block Blast">
        <div class="blast-layout">
          <aside class="blast-side">
            <div class="blast-stat blast-stat--score">
              <span>Счёт</span>
              <strong id="blast-score">0</strong>
            </div>
            <div class="blast-stat">
              <span>Рекорд</span>
              <strong id="blast-best">0</strong>
            </div>
            <div class="blast-stat">
              <span>Очистки</span>
              <strong id="blast-clears">0</strong>
            </div>
            <div class="blast-stat">
              <span>Комбо</span>
              <strong id="blast-combo">0</strong>
            </div>
            <label class="game-vol" for="blast-vol">
              <span class="game-vol__row">
                <span>Громкость</span>
                <strong id="blast-vol-label">70%</strong>
              </span>
              <input id="blast-vol" type="range" min="10" max="200" step="1" value="70" />
            </label>
            <p id="blast-media-title" class="blast-media-title"></p>
            <div class="blast-actions">
              <button type="button" class="btn" id="blast-restart">Заново</button>
            </div>
          </aside>

          <div class="blast-stage">
            <div class="blast-board-wrap">
              <canvas id="blast-board" width="480" height="480" role="img" aria-label="Поле Block Blast"></canvas>
              <div id="blast-board-anims" class="blast-anim-layer" aria-hidden="true"></div>
              <div id="blast-overlay" class="blast-overlay">
                <p id="blast-overlay-title" class="blast-overlay__title">Block Blast</p>
                <p id="blast-overlay-text" class="blast-overlay__text">Ставь фигуры из фото и видео. Заполняй ряды и столбцы.</p>
                <button type="button" class="btn" id="blast-overlay-btn">Играть</button>
              </div>
            </div>

            <div class="blast-tray" aria-label="Фигуры">
              <canvas id="blast-tray" width="480" height="140"></canvas>
              <div id="blast-tray-anims" class="blast-anim-layer" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="blast-float" class="blast-float hidden" aria-hidden="true"></div>

    <script src="/blockblast.js?v=blast8"></script>
  </body>
</html>
